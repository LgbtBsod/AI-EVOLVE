[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"
description = "Rust core layer for AI Evolve: simulation, world generation, storage"
authors = ["AI Evolve Team"]

[lib]
name = "rust_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyO3 для Python интеграции
pyo3 = { version = "0.20", features = ["extension-module"] }

# Lua для контента
mlua = { version = "0.9", features = ["lua54"] }

# SQLite для хранения
rusqlite = { version = "0.30", features = ["bundled"] }

# PRNG для детерминизма
rand_chacha = "0.3"
rand = "0.8"

# Математика
nalgebra = "0.32"

# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ECS (опционально)
hecs = "0.10"

# Логирование
log = "0.4"
env_logger = "0.10"

# Ошибки
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
criterion = "0.5"

[features]
default = []
extension-module = ["pyo3/extension-module"]
