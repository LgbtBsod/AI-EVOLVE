name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game:
    name: Game (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Combat / effects / leveling smoke test (headless, 50 tests)
        run: python tools/combat_smoke_test.py
      - name: Import check
        run: python -c "import main"
      # Windowless (window-type none) + fixed-step virtual clock: no OpenGL,
      # runs on every OS. Includes a byte-for-byte determinism check on the real game.
      - name: Agent + QA tools (agent_play / dev_probe --render none --fast / probe_db / qa.py)
        run: python -m pytest -q tests/test_agent_tools.py tests/test_qa_tools.py
      - name: Pathfinding (Python twin; Rust parity runs in the rust_core job)
        run: python -m pytest -q tests/test_pathfinding.py
      - name: Item effects (schema, Lua bridge via lupa, Lost My Self spec, item forge, builder UI)
        run: python -m pytest -q tests/test_lua_bridge.py tests/test_lost_my_self_spec.py tests/test_training_room_effectschema.py tests/test_item_forge.py tests/test_web_builder.py
      # The boot test renders into an offscreen buffer and needs OpenGL:
      # Linux runners get it from Mesa (llvmpipe) under a virtual X server.
      - name: Install Mesa + Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1 libgl1-mesa-dri libglu1-mesa
      - name: Boot test (GameCore -> menu/world -> plugins, offscreen)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/boot_smoke_test.py
      # One line per check + a `QA verdict` header (lua_content/qa.lua, tools/qa_report.py);
      # `python tools/qa.py ci` extracts these lines from the log of a failed run.
      - name: QA layer tests (uniform report, CI log reader, quality ratchet, repo hygiene guard)
        run: python -m pytest -q tests/test_qa_report.py tests/test_qa_ci.py tests/test_quality_check.py tests/test_repo_hygiene.py
      - name: QA verdict (qa.py check --ci)
        run: python tools/qa.py check --ci --no-cache
      # SOLID/DRY/SRP/SSOT ratchet: ruff + radon + vulture + import-linter vs tests/quality_baseline.json (tools/quality_metrics.py).
      # The counts do not depend on the OS, so one run is enough. Failing? `python tools/qa.py quality --worst 10` lists the offenders.
      - name: Code-quality ratchet (new violations fail)
        if: runner.os == 'Linux'
        run: python tools/qa.py check --name quality --no-cache

  rust:
    name: rust_core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_core
      - name: cargo test
        working-directory: rust_core
        env:
          PYO3_PYTHON: ${{ steps.py.outputs.python-path }}
        run: cargo test
      - name: Build and install the extension (maturin via pyproject.toml)
        run: python -m pip install ./rust_core pytest "lupa>=2.8"
      - name: FFI tests
        run: python -m pytest -q rust_core/tests/test_ffi.py
      # A*/JPS/flow field: Rust kernel must match the Python twin on seeded random grids
      - name: Pathfinding parity (Rust vs Python twin)
        run: python -m pytest -q tests/test_pathfinding.py
      # rust_core.LuaContent and the lupa fallback must give the same data on every Lua file
      - name: Lua bridge parity (mlua vs lupa)
        run: python -m pytest -q tests/test_lua_bridge.py
